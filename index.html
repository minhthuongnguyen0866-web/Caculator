
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="maytinh">

        <h2>Máy tính</h2>

        <!-- Màn hình hiển thị -->
        <input type="text" id="manhinh" value="0" readonly>

        <!-- Các nút bấm -->
        <div class="cacnut">

            <button onclick="xoa()">AC</button>
            <button onclick="xoaMotKyTu()">DEL</button>
            <button onclick="nhap('%')">%</button>
            <button class="pheptinh" onclick="nhap('/')">÷</button>

            <button onclick="nhap('7')">7</button>
            <button onclick="nhap('8')">8</button>
            <button onclick="nhap('9')">9</button>
            <button class="pheptinh" onclick="nhap('*')">×</button>

            <button onclick="nhap('4')">4</button>
            <button onclick="nhap('5')">5</button>
            <button onclick="nhap('6')">6</button>
            <button class="pheptinh" onclick="nhap('-')">-</button>

            <button onclick="nhap('1')">1</button>
            <button onclick="nhap('2')">2</button>
            <button onclick="nhap('3')">3</button>
            <button class="pheptinh" onclick="nhap('+')">+</button>

            <button onclick="nhap('0')">0</button>
            <button onclick="nhap('.')">.</button>
            <button class="bang" onclick="tinh()">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
